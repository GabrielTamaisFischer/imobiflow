services:
  imobiflow-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: imobiflow-api
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "3333:3333"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
